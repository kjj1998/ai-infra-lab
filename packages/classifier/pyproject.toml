[project]
name = "classifier"
version = "0.1.0"
description ="text sentiment classification"
readme = "README.md"
authors = [
    { email = "koh.jun.jie@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "litserve>=0.2.19",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "locust>=2.46.6",
    "py-spy>=0.4.2",
    "pytest>=9.1.1",
]
